<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naveen Kumar - Image Gallery</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    transition: background 0.5s, color 0.5s;
  }

  header {
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    color: #333;
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .controls input[type="text"] {
    padding: 10px;
    width: 250px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
  }

  .controls button, .theme-toggle {
    padding: 10px 15px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }

  .controls button:hover, .theme-toggle:hover {
    background: #45a049;
  }

  .theme-toggle {
    background: #555;
  }

  /* Masonry Grid Layout */
  .gallery {
    column-count: 4;
    column-gap: 10px;
    padding: 10px;
  }

  @media (max-width: 900px) {
    .gallery { column-count: 2; }
  }

  @media (max-width: 600px) {
    .gallery { column-count: 1; }
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
    cursor: pointer;
    border-radius: 10px;
  }

  .gallery-item img {
    width: 100%;
    border-radius: 10px;
    transition: transform 0.4s ease, filter 0.3s ease;
  }

  .gallery-item:hover img {
    transform: scale(1.05);
    filter: brightness(0.7);
  }

  .caption {
    position: absolute;
    bottom: 0;
    width: 100%;
    color: #fff;
    background: rgba(0, 0, 0, 0.5);
    padding: 8px;
    text-align: center;
    font-size: 16px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.4s ease;
  }

  .gallery-item:hover .caption {
    opacity: 1;
    transform: translateY(0);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: fadeIn 0.5s ease;
  }

  .lightbox img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 10px;
    transition: transform 0.4s ease;
  }

  .lightbox.fullscreen img {
    max-width: 95%;
    max-height: 95%;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .lightbox-thumbnails {
    display: flex;
    overflow-x: auto;
    margin-top: 10px;
    gap: 8px;
  }

  .lightbox-thumbnails img {
    width: 60px;
    height: 40px;
    object-fit: cover;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.7;
  }

  .lightbox-thumbnails img.active {
    opacity: 1;
    border: 2px solid white;
  }

  .lightbox button {
    position: absolute;
    top: 50%;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
    padding: 10px;
    transform: translateY(-50%);
  }

  .prev { left: 30px; }
  .next { right: 30px; }

  .close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    background: transparent;
  }

  .fullscreen-toggle {
    position: absolute;
    bottom: 20px;
    right: 30px;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Dark theme */
  body.dark {
    background: #121212;
    color: white;
  }

  body.dark .controls button {
    background: #333;
  }

  body.dark header {
    color: white;
  }

</style>
</head>
<body>
  <header>NAVEEN KUMAR - IMAGE GALLERY</header>

  <div class="controls">
    <input type="text" id="search" placeholder="Search images...">
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('nature')">Nature</button>
    <button onclick="filterCategory('city')">City</button>
    <button onclick="filterCategory('animals')">Animals</button>
    <button onclick="filterCategory('travel')">Travel</button>
    <button onclick="document.getElementById('upload').click()">Upload</button>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    <input type="file" id="upload" multiple accept="image/*" style="display:none;">
  </div>

  <div class="gallery" id="gallery">
    <div class="gallery-item" data-category="nature" data-caption="Beautiful Forest">
      <img src="https://picsum.photos/id/1018/600/400" alt="">
      <div class="caption">Beautiful Forest</div>
    </div>
    <div class="gallery-item" data-category="city" data-caption="City Skyline">
      <img src="https://picsum.photos/id/1015/600/400" alt="">
      <div class="caption">City Skyline</div>
    </div>
    <div class="gallery-item" data-category="animals" data-caption="Cute Puppy">
      <img src="https://picsum.photos/id/237/600/400" alt="">
      <div class="caption">Cute Puppy</div>
    </div>
    <div class="gallery-item" data-category="nature" data-caption="Mountain Range">
      <img src="https://picsum.photos/id/1003/600/400" alt="">
      <div class="caption">Mountain Range</div>
    </div>
    <div class="gallery-item" data-category="travel" data-caption="Desert Adventure">
      <img src="https://picsum.photos/id/1002/600/400" alt="">
      <div class="caption">Desert Adventure</div>
    </div>
    <div class="gallery-item" data-category="nature" data-caption="Green Valley">
      <img src="https://picsum.photos/id/1025/600/400" alt="">
      <div class="caption">Green Valley</div>
    </div>
    <div class="gallery-item" data-category="animals" data-caption="Wild Tiger">
      <img src="https://picsum.photos/id/1074/600/400" alt="">
      <div class="caption">Wild Tiger</div>
    </div>
    <div class="gallery-item" data-category="city" data-caption="Downtown Streets">
      <img src="https://picsum.photos/id/1031/600/400" alt="">
      <div class="caption">Downtown Streets</div>
    </div>
    <div class="gallery-item" data-category="travel" data-caption="Snow Mountains">
      <img src="https://picsum.photos/id/1040/600/400" alt="">
      <div class="caption">Snow Mountains</div>
    </div>
    <div class="gallery-item" data-category="animals" data-caption="Majestic Horse">
      <img src="https://picsum.photos/id/1076/600/400" alt="">
      <div class="caption">Majestic Horse</div>
    </div>
    <div class="gallery-item" data-category="nature" data-caption="Sunset Beach">
      <img src="https://picsum.photos/id/1056/600/400" alt="">
      <div class="caption">Sunset Beach</div>
    </div>
    <div class="gallery-item" data-category="city" data-caption="Night Lights">
      <img src="https://picsum.photos/id/1043/600/400" alt="">
      <div class="caption">Night Lights</div>
    </div>
    <div class="gallery-item" data-category="travel" data-caption="Historic Bridge">
      <img src="https://picsum.photos/id/1081/600/400" alt="">
      <div class="caption">Historic Bridge</div>
    </div>
    <div class="gallery-item" data-category="nature" data-caption="Autumn Leaves">
      <img src="https://picsum.photos/id/1016/600/400" alt="">
      <div class="caption">Autumn Leaves</div>
    </div>
    <div class="gallery-item" data-category="city" data-caption="Sky Tower View">
      <img src="https://picsum.photos/id/1045/600/400" alt="">
      <div class="caption">Sky Tower View</div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="close" onclick="closeLightbox()">✖</button>
    <button class="prev" onclick="navigate(-1)">❮</button>
    <img id="lightbox-img" src="">
    <button class="next" onclick="navigate(1)">❯</button>
    <div class="lightbox-thumbnails" id="thumbnails"></div>
    <button class="fullscreen-toggle" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

<script>
  let currentIndex = 0;
  const galleryItems = document.querySelectorAll('.gallery-item');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const thumbnails = document.getElementById('thumbnails');

  galleryItems.forEach((item, index) => {
    item.addEventListener('click', () => openLightbox(index));
  });

  function openLightbox(index) {
    currentIndex = index;
    lightbox.style.display = 'flex';
    lightboxImg.src = galleryItems[index].querySelector('img').src;
    updateThumbnails();
  }

  function closeLightbox() {
    lightbox.style.display = 'none';
  }

  function navigate(dir) {
    currentIndex = (currentIndex + dir + galleryItems.length) % galleryItems.length;
    lightboxImg.src = galleryItems[currentIndex].querySelector('img').src;
    updateThumbnails();
  }

  function updateThumbnails() {
    thumbnails.innerHTML = '';
    galleryItems.forEach((item, i) => {
      const thumb = document.createElement('img');
      thumb.src = item.querySelector('img').src;
      if (i === currentIndex) thumb.classList.add('active');
      thumb.onclick = () => openLightbox(i);
      thumbnails.appendChild(thumb);
    });
  }

  function toggleFullscreen() {
    lightbox.classList.toggle('fullscreen');
  }

  // Search filter
  document.getElementById('search').addEventListener('input', e => {
    const term = e.target.value.toLowerCase();
    galleryItems.forEach(item => {
      const caption = item.dataset.caption.toLowerCase();
      item.style.display = caption.includes(term) ? 'inline-block' : 'none';
    });
  });

  // Category filter
  function filterCategory(cat) {
    galleryItems.forEach(item => {
      if (cat === 'all' || item.dataset.category === cat)
        item.style.display = 'inline-block';
      else
        item.style.display = 'none';
    });
  }

  // Image upload
  document.getElementById('upload').addEventListener('change', e => {
    const files = e.target.files;
    for (const file of files) {
      const reader = new FileReader();
      reader.onload = () => {
        const div = document.createElement('div');
        div.classList.add('gallery-item');
        div.dataset.category = 'custom';
        div.dataset.caption = file.name;
        div.innerHTML = `<img src="${reader.result}" alt=""><div class="caption">${file.name}</div>`;
        div.addEventListener('click', () => openLightbox(galleryItems.length));
        document.getElementById('gallery').appendChild(div);
      };
      reader.readAsDataURL(file);
    }
  });

  // Theme toggle
  function toggleTheme() {
    document.body.classList.toggle('dark');
  }
</script>
</body>
</html>
